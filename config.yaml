# Faceless YouTube automation — channel configuration.
# Secrets (API keys, OAuth tokens) live in environment variables / .env, never here.

channel:
  name: "Odd Annals"                  # youtube.com/@OddAnnals
  niche: "history, little-known facts and unsolved mysteries"
  audience: "curious adults 18-45 who binge documentaries and 'rabbit hole' videos"
  language: "hi"                      # main language (see languages: below)
  category_id: "27"                   # 27 = Education (22 People & Blogs, 24 Entertainment)
  voice_guide: "channel/voice.md"     # style guide every script prompt reads

# How many of each to produce per run (GitHub Actions runs once a day).
# YouTube API quota: ~1,600 units per upload, 10,000/day default => keep total <= 5.
schedule:
  longs_per_run: 1
  shorts_per_run: 2
  # Publish times per language are under languages: below (UTC). Videos upload as private and
  # YouTube flips them public at that time; a time already passed today => published immediately.

long:
  target_words: 2000                  # English words; Hindi version ~18-20 min (niche winners median 22 min)
  min_scenes: 18
  width: 1920
  height: 1080
  voice: "en-US-AndrewNeural"
  rate: "+0%"
  burn_captions: true                 # on-screen captions (Hinglish for Hindi videos)
  upload_captions: false              # captions are on screen; skipping the track saves 400 quota units

short:
  target_words: 75                    # English words; Hindi + Gemini narration runs longer => ~55-60 s
  min_scenes: 5
  width: 1080
  height: 1920
  voice: "en-US-AndrewNeural"
  rate: "+8%"
  burn_captions: true                 # Shorts need big on-screen captions
  upload_captions: false

video:
  fps: 30
  shot_tail_seconds: 0.08             # tiny gap between sentences
  scene_tail_seconds: 0.35            # longer breath at the end of each scene
  music_volume: 0.08                  # royalty-free .mp3s in assets/music/ (see README: copyright)
  bed_volume: 1.0                     # synthesised ambient bed used when assets/music/ is empty
  sfx_volume: 0.5                     # whoosh on every picture change (0 = off)
  renderer: "remotion"                # remotion = motion graphics (maps, dates, counters, karaoke captions)
                                      # ffmpeg = the simpler built-in renderer (uses "animation" below)
  animation: "storybook"              # storybook = camera move + light particles + glow on painted scenes
                                      # sketch = pen draws each picture live | kenburns = plain pan/zoom
  sketch_draw_share: 0.55             # share of each shot spent drawing before colours wash in
  transition_seconds: 0.35            # animated transition between shots (0 = hard cuts)
  transitions:
    long: ["slideleft", "slideright", "smoothleft", "smoothright", "fade", "circleopen", "wipeleft"]
    short: ["zoomin", "slideup", "slidedown", "slideleft", "hblur", "fadeblack"]
  crf: 19                             # lower = sharper; 19 keeps watercolour gradients clean
  preset: "faster"
  upload_height: {long: 1440}         # upscale long videos to 1440p so YouTube serves its better VP9 encode

# AI illustrations: one per sentence, in a single consistent animated style.
images:
  providers: ["cloudflare", "pollinations"]
  # flux-1-schnell at 4 steps costs ~58 of the free 10,000 daily neurons (~170 images/day).
  # (lucid-origin looks nicer but costs ~4,000 per image = 2 free images/day.)
  cloudflare_models: ["@cf/black-forest-labs/flux-1-schnell"]
  cloudflare_steps: 4
  max_images: {long: 70, short: 14}   # more shots than this -> neighbouring shots share an image
  max_minutes: {long: 45, short: 10}  # time budget for AI images per video (backups are slow);
                                      # shots left over use stock clips / reuse earlier images
  styles:
    # Storybook look (hand-painted anime watercolour), same for long videos and Shorts.
    long: >-
      hand-painted anime watercolor storybook illustration, soft painterly textures, warm cinematic
      light, lush detailed background, expressive characters, gentle glow, rich colors,
      no text, no letters, no watermark, no signature
    short: >-
      hand-painted anime watercolor storybook illustration, soft painterly textures, dramatic warm
      light, detailed background, expressive emotional characters, vivid colors, close framing,
      no text, no letters, no watermark, no signature
  thumbnail_style: >-
    hyper-detailed vibrant epic digital painting, saturated colors, dramatic golden-hour light, glowing
    highlights, high contrast, cinematic, main subject large on the right half, no text, no watermark
  stock_broll_share: 0                # real stock clips mixed into long videos (0 = cartoon only)
  fallback_to_stock: true             # if every image provider fails, use stock footage for that shot

# Languages. Hindi is the main channel language. Every topic is researched and scripted once,
# illustrated once, then narrated per language (English versions reuse the same illustrations).
languages:
  hi:
    enabled: true                     # main language: makes every video in schedule above
    voice: "hi-IN-MadhurNeural"       # Edge voice (backup)
    tts:
      engine: "gemini"                # expressive narration; whole video falls back to Edge if unavailable
      voice: "Charon"
      models: ["gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview", "gemini-3.8-flash-tts"]
      style: >-
        Read the following Hindi line as a gripping, warm Indian documentary storyteller: natural
        conversational Hindi, clear diction, a brisk pace, rising tension on mysteries, dramatic
        pauses only where the sentence needs one. Read only the line, nothing else.
    captions: "hinglish"              # hinglish (Roman letters) | hindi (Devanagari)
    long_rate: "+12%"                 # Madhur is slow at +0%; this is a natural documentary pace
    short_rate: "+20%"
    short_max_seconds: 60             # Shorts longer than this are sped up (max 30%)
    long_publish_utc: ["14:30"]       # 8:00 PM IST
    short_publish_utc: ["06:30", "12:30"]   # 12:00 PM and 6:00 PM IST
  en:
    enabled: false                    # set true to ALSO publish English versions
    longs_per_run: 1                  # first N topics get an English version
    shorts_per_run: 1                 #   (quota: keep total uploads per day <= 5)
    long_publish_utc: ["15:00"]
    short_publish_utc: ["13:00"]

llm:
  # Tried in order; the first provider with an API key that succeeds wins.
  providers: ["gemini", "groq"]
  gemini_models: ["gemini-3.5-flash", "gemini-3.8-flash", "gemini-flash-latest", "gemini-flash-lite-latest"]
  groq_models: ["openai/gpt-oss-120b", "qwen/qwen3.8-27b"]
  temperature: 0.9

research:
  # Competitor channels in the niche. The pipeline measures which of their recent videos beat
  # that channel's own median views (the swipe.py method) and shows the outliers to the topic picker.
  # Handles that don't resolve are skipped with a warning — edit freely.
  competitor_handles:
    - "@OverSimplified"
    - "@SimpleHistory"
    - "@TheInfographicsShow"
    - "@LEMMiNO"
    - "@Nexpo"
    - "@historymarche"
  outlier_min_multiple: 2.0
  videos_per_channel: 30

# Channel identity: a recurring host + named, numbered series (why story channels get loyal viewers).
host:
  name: "इतिहास दादा"
  name_en: "Itihaas Dada"
  look: >-
    a warm, wise Indian grandfather storyteller in his seventies, white beard and moustache,
    round brass spectacles, saffron shawl over a white kurta, holding a glowing brass lantern
  # He opens each video right after the hook and closes it with the call to action.
series:
  - id: "mandir"
    name: "मंदिरों के रहस्य"
    label: "मंदिर का रहस्य"
    about: >-
      mysteries, legends and history of famous Indian temples and shrines (architecture, miracles
      believed by devotees, origin stories), told respectfully; beliefs presented as beliefs
  - id: "pauranik"
    name: "पौराणिक रहस्य"
    label: "पौराणिक रहस्य"
    about: >-
      places and stories linked to the Ramayana, Mahabharata and Puranas (Ram Setu, Dwarka, Kurukshetra),
      what history, archaeology and tradition each say; respectful, never mocking
  - id: "bharat"
    name: "भारत के अनसुलझे रहस्य"
    label: "भारत के रहस्य"
    about: "Indian history, forts, temples, kings, freedom struggle, unsolved Indian cases and places"
  - id: "duniya"
    name: "दुनिया के रहस्य"
    label: "दुनिया के रहस्य"
    about: "world mysteries, lost civilisations, strange events outside India"
  - id: "kahani"
    name: "इतिहास की सच्ची कहानियाँ"
    label: "सच्ची कहानी"
    about: "dramatic true stories of real people: survivors, spies, explorers, rulers"

# Extra Shorts cut from each long video (same pictures, new hook), linking to the full video.
clips:
  per_long: 2
  publish_utc: ["09:30", "16:30"]     # 3:00 PM and 10:00 PM IST

# Also post every Short as an Instagram Reel / Facebook Reel when Meta credentials exist.
social:
  instagram: true
  facebook: true

keywords:
  # YouTube autocomplete is queried with these to see what Indian viewers search for right now.
  niche_seeds: ["रहस्य", "रहस्यमयी", "अनसुलझे रहस्य", "इतिहास की कहानी", "भारत का इतिहास",
                "mystery in hindi", "history in hindi", "unsolved mystery hindi", "sach kya hai",
                "duniya ke rahasya", "kaise hua", "kyon hua"]

quality:
  hook_candidates: 5                  # LLM writes N hooks, hookscore.py keeps the best
  title_candidates: 10                # LLM writes N titles, title.py keeps the best
  max_script_attempts: 2
  min_review_score: 6.5               # quality gate: average 1-10 score a script needs to be made

thumbnails:
  mode: "ab"                          # ab = rotate templates, then favour the winner (data/thumb_winner.json)
  templates: ["rahasya", "storybook", "yellow"]   # rahasya = the niche's winning look (see README)
  label: "ODD ANNALS • रहस्य"          # yellow series label at the bottom of storybook thumbnails

reach:
  auto_publish_private: false         # true = make our private, unscheduled uploads public. Off so a
                                      # video YOU set to private is never re-published automatically.
  post_comments: true                 # channel posts the script's question as the first comment
  max_replies_per_day: 6              # English replies to new viewer comments (0 = off)
  repackage_after_hours: 72           # judge a video after 3 days...
  repackage_below_median: 0.5         # ...and retitle it once if under half its peers' median views

youtube:
  privacy: "public"                   # public | unlisted | private
  made_for_kids: false
  # Set true if a video contains realistic AI-generated people/events viewers could mistake for real.
  # Stock footage + narration does not need it.
  contains_synthetic_media: false
  long_playlist_id: ""                # optional: auto-add long videos to this playlist
  short_playlist_id: ""
