# Faceless YouTube automation — channel configuration.
# Secrets (API keys, OAuth tokens) live in environment variables / .env, never here.

goal:                                 # owner target (set Oct 17): weekly Telegram progress check against it
  subscribers: 1000
  by: "2026-11-17"

channel:
  name: "Odd Annals"                  # youtube.com/@OddAnnals
  handle: "@oddannals"                # used for the subscribe link in descriptions
  niche: "history, little-known facts and unsolved mysteries"
  audience: "curious adults 18-45 who binge documentaries and 'rabbit hole' videos"
  language: "hi"                      # main language (see languages: below)
  category_id: "27"                   # 27 = Education (22 People & Blogs, 24 Entertainment)
  voice_guide: "channel/voice.md"     # style guide every script prompt reads

# How many of each to produce per run (GitHub Actions runs once a day).
# YouTube API quota: ~1,600 units per upload, 10,000/day default => keep total <= 5.
schedule:
  longs_per_run: 0                    # Shorts-first (owner decision, Oct 15): long videos get ~0 views on a new
  shorts_per_run: 5                   # channel. Owner decision Oct 15: Shorts only, no long videos (compilation off too)
  # Publish times per language are under languages: below (UTC). Videos upload as private and
  # YouTube flips them public at that time; a time already passed today => published immediately.

long:
  target_words: 2000                  # English words; Hindi version ~18-20 min (niche winners median 22 min)
  min_scenes: 18
  width: 1920
  height: 1080
  voice: "en-US-AndrewNeural"
  rate: "+0%"
  burn_captions: true                 # on-screen captions (Hinglish for Hindi videos)
  upload_captions: false              # captions are on screen; skipping the track saves 400 quota units

short:
  target_words: 60                    # ~30-40 s: a fully watched short Short beats a half-watched long one
  min_scenes: 5
  width: 1080
  height: 1920
  voice: "en-US-AndrewNeural"
  rate: "+8%"
  burn_captions: true                 # Shorts need big on-screen captions
  upload_captions: false

video:
  fps: 30
  shot_tail_seconds: 0.08             # tiny gap between sentences
  scene_tail_seconds: 0.35            # longer breath at the end of each scene
  music_volume: 0.08                  # royalty-free .mp3s in assets/music/ (see README: copyright)
  bed_volume: 1.0                     # synthesised ambient bed used when assets/music/ is empty
  sfx_volume: 0.5                     # whoosh on every picture change (0 = off)
  renderer: "remotion"                # remotion = motion graphics (maps, dates, counters, karaoke captions)
                                      # ffmpeg = the simpler built-in renderer (uses "animation" below)
  parallax: true                      # depth maps -> 2.5D camera (foreground moves against background)
  animation: "storybook"              # storybook = camera move + light particles + glow on painted scenes
                                      # sketch = pen draws each picture live | kenburns = plain pan/zoom
  sketch_draw_share: 0.55             # share of each shot spent drawing before colours wash in
  transition_seconds: 0.35            # animated transition between shots (0 = hard cuts)
  transitions:
    long: ["slideleft", "slideright", "smoothleft", "smoothright", "fade", "circleopen", "wipeleft"]
    short: ["zoomin", "slideup", "slidedown", "slideleft", "hblur", "fadeblack"]
  crf: 19                             # lower = sharper; 19 keeps watercolour gradients clean
  preset: "faster"
  upload_height: {long: 1440}         # upscale long videos to 1440p so YouTube serves its better VP9 encode

# AI pictures: one per sentence, in a single consistent style (Shorts: photoreal).
images:
  providers: ["cloudflare", "pollinations"]
  # flux-1-schnell at 4 steps costs ~58 of the free 10,000 daily neurons (~170 images/day).
  # (lucid-origin looks nicer but costs ~4,000 per image = 2 free images/day.)
  cloudflare_models: ["@cf/black-forest-labs/flux-1-schnell"]
  cloudflare_steps: 4
  max_images: {long: 70, short: 20}   # more shots than this -> neighbouring shots share an image
  max_minutes: {long: 45, short: 15}  # time budget for AI images per video (backups are slow);
                                      # shots left over use stock clips / reuse earlier images
  styles:
    # 3D animated-movie look (Pixar/Disney-like characters in detailed real-looking places).
    long: >-
      3D animated movie still, Pixar and Disney style, stylized expressive characters with big
      expressive eyes and soft rounded features, detailed realistic environment and props, cinematic
      volumetric lighting, soft depth of field, warm filmic color grade, highly detailed render,
      no text, no letters, no watermark, no signature
    # Shorts: photoreal film-still look (owner chose it 2026-10-18 after the drama test).
    short: >-
      photorealistic cinematic film still, shot on 35mm, real people with natural skin texture and a
      strong readable emotion, period-accurate clothes and props, detailed real location, moody
      cinematic lighting, shallow depth of field, subtle film grain, high detail, close framing,
      no text, no letters, no watermark, no cartoon, no 3D render, no illustration
    # Master pictures (host + recurring characters) are drawn in this look so every shot matches.
    master: >-
      photorealistic portrait photograph, real person, natural skin texture, soft studio light,
      sharp focus, high detail, no text, no watermark, no cartoon, no 3D render, no illustration
  thumbnail_style: >-
    photorealistic cinematic movie still, one real person with a strong emotion (shock, awe, fear),
    dramatic rim light, high contrast, rich filmic colors, main subject large on the right half,
    no text, no watermark, no cartoon, no 3D render
  # How the script writer directs the pictures (must match styles.short).
  look: >-
    The pictures are PHOTOREALISTIC cinematic film stills of real-looking people (never cartoon, never
    Pixar, never a 3D render), so direct them like a live-action historical movie
  # Words stripped from every picture prompt so nothing pulls the image model back to cartoon.
  strip_words: ["pixar", "disney", "cartoon", "3d animated", "animated", "animation", "3d render", "illustration"]
  # Same face all video long: a master picture per main character, then FLUX.2 Klein draws the
  # character's shots from it (~125 neurons per shot vs ~58 for schnell, so it is budgeted).
  character_refs: 2                   # main characters per story that get a master picture
  reference_shots: {long: 16, short: 10}
  reference_size: [1024, 576]
  check: true                         # AI art director (Gemini vision) redraws clearly wrong pictures once
  check_max_redraws: 4
  check_models: ["gemini-flash-lite-latest", "gemini-flash-latest"]
  real_photos: {short: 2, long: 6}    # real archive pictures (public domain / CC BY) with a REAL PHOTO stamp
  upscale: true                       # Real-ESRGAN x4v3 (open source, CPU) sharpens every picture...
  upscale_px: 2048                    # ...to this long side (a Short crops a narrow strip of a square image)
  stock_broll_share: 0                # real stock clips mixed into long videos (0 = cartoon only)
  fallback_to_stock: true             # if every image provider fails, use stock footage for that shot

# Languages. Hindi is the main channel language. Every topic is researched and scripted once,
# illustrated once, then narrated per language (English versions reuse the same illustrations).
languages:
  hi:
    enabled: false                    # owner request: Hindi off, only English and Tamil live
    voice: "hi-IN-MadhurNeural"       # Edge voice (backup)
    tts:
      engine: "gemini"                # expressive narration; whole video falls back to Edge if unavailable
      voice: "Charon"
      models: ["gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview", "gemini-3.8-flash-tts"]
      style: >-
        Read the following Hindi line as a gripping, warm Indian documentary storyteller: natural
        conversational Hindi, clear diction, a brisk pace, rising tension on mysteries, dramatic
        pauses only where the sentence needs one. Read only the line, nothing else.
    captions: "hinglish"              # hinglish (Roman letters) | hindi (Devanagari)
    long_rate: "+12%"                 # Madhur is slow at +0%; this is a natural documentary pace
    short_rate: "+20%"
    short_max_seconds: 60             # Shorts longer than this are sped up (max 30%)
    long_publish_utc: ["14:30"]       # 8:00 PM IST
    short_publish_utc: ["06:30", "12:30"]   # 12:00 PM and 6:00 PM IST
  # Regional channels: same stories and pictures, own language + own YouTube channel/Google project.
  # Turn one on after creating its channel and adding its YT_*_XX secrets (README: regional channels).
  ta:
    enabled: true
    channel_name: "Odd Annals Tamil"
    handle: "@oddannalstamil"
    youtube_env: "_TA"                # uses YT_CLIENT_ID_TA / YT_CLIENT_SECRET_TA / YT_REFRESH_TOKEN_TA
    longs_per_run: 0
    shorts_per_run: 3                 # owner decision Oct 20: Tamil Shorts now outperform English (400-880 views each)
    voice: "ta-IN-ValluvarNeural"
    captions: "native"
    long_rate: "+8%"
    short_rate: "+15%"
    short_max_seconds: 60
    tts: &regional_tts
      engine: "gemini"
      voice: "Charon"
      models: ["gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview", "gemini-3.8-flash-tts"]
      style: >-
        Read the following line as a gripping, warm documentary storyteller in its own language, with
        natural conversational delivery, clear diction and a brisk pace. Read only the line, nothing else.
    long_publish_utc: ["14:00"]
    short_publish_utc: ["10:30", "13:30", "15:30"]   # 4:00 PM, 7:00 PM, 9:00 PM IST
  te:
    enabled: false
    channel_name: "Odd Annals Telugu"
    youtube_env: "_TE"
    longs_per_run: 1
    shorts_per_run: 2
    voice: "te-IN-MohanNeural"
    captions: "native"
    long_rate: "+8%"
    short_rate: "+15%"
    short_max_seconds: 60
    tts: *regional_tts
    long_publish_utc: ["14:00"]
    short_publish_utc: ["07:00", "12:00"]
  bn:
    enabled: false
    channel_name: "Odd Annals Bangla"
    youtube_env: "_BN"
    longs_per_run: 1
    shorts_per_run: 2
    voice: "bn-IN-BashkarNeural"
    captions: "native"
    long_rate: "+8%"
    short_rate: "+15%"
    short_max_seconds: 60
    tts: *regional_tts
    long_publish_utc: ["13:30"]
    short_publish_utc: ["06:30", "12:00"]
  mr:
    enabled: false
    channel_name: "Odd Annals Marathi"
    youtube_env: "_MR"
    longs_per_run: 1
    shorts_per_run: 2
    voice: "mr-IN-ManoharNeural"
    captions: "native"
    long_rate: "+8%"
    short_rate: "+15%"
    short_max_seconds: 60
    tts: *regional_tts
    long_publish_utc: ["14:00"]
    short_publish_utc: ["07:00", "12:00"]
  en:
    enabled: true                     # focus: English Shorts for every history topic (owner request)
    longs_per_run: 0                  # Shorts only (owner decision Oct 15)
    shorts_per_run: 5                 # owner goal Oct 17: 1,000 subscribers in a month -> more chances (5 x 1,750 quota units fits the 10k/day)
    long_publish_utc: ["15:00"]
    short_publish_utc: ["12:00", "14:00", "16:00", "18:00", "21:00"]   # 5:30-11:30 PM + 2:30 AM IST: UK afternoon/evening, US day
    # Trial from Oct 20: the day's LAST English Short (no Tamil twin, so Tamil keeps its free Gemini
    # quota) is narrated by Gemini's expressive voice; the others stay on Edge. Compare swipe-away.
    tts:
      engine: "gemini"
      test_only: true
      voice: "Charon"
      models: ["gemini-2.5-flash-preview-tts", "gemini-3.1-flash-tts-preview", "gemini-3.8-flash-tts"]
      style: >-
        Read the following line as a gripping documentary storyteller for a YouTube mystery channel:
        natural American English, confident and intriguing, rising tension on the twist, clear diction.
        Read only the line, nothing else.

llm:
  # Tried in order; the first provider with an API key that succeeds wins.
  providers: ["gemini", "groq"]
  gemini_models: ["gemini-3.5-flash", "gemini-3.8-flash", "gemini-flash-latest", "gemini-flash-lite-latest"]
  groq_models: ["openai/gpt-oss-120b", "qwen/qwen3.8-27b"]
  temperature: 0.9

research:
  # Competitor channels in the niche. The pipeline measures which of their recent videos beat
  # that channel's own median views (the swipe.py method) and shows the outliers to the topic picker.
  # Handles that don't resolve are skipped with a warning — edit freely.
  competitor_handles:
    - "@OverSimplified"
    - "@SimpleHistory"
    - "@TheInfographicsShow"
    - "@LEMMiNO"
    - "@Nexpo"
    - "@historymarche"
  outlier_min_multiple: 2.0
  videos_per_channel: 30

# Channel identity: a recurring host + named, numbered series (why story channels get loyal viewers).
host:
  name: "इतिहास दादा"
  name_en: "Itihaas Dada"
  reference: "assets/host/host-photoreal.jpg"   # master picture in the current look (old cartoon one: host.jpg)
  look: >-
    a warm, wise Indian grandfather storyteller in his seventies, white beard and moustache,
    round brass spectacles, saffron shawl over a white kurta, holding a glowing brass lantern
  # He opens each video right after the hook and closes it with the call to action.
# Shorts series: a recognisable named show (with an episode number on frame one) is what turns
# viewers into subscribers. The topic picker files every Short under one of these.
short_series:
  - id: "proven"
    name_en: "Mocked, Then Proven Right"
    name_ta: "கேலி செய்தார்கள், பின் நிரூபணமானது"
    about: >-
      people, warnings or ideas that were laughed at or ignored, then turned out right (often saving
      lives): a real event with a year, the mockery, the moment they were proven right
  - id: "impossible"
    name_en: "Things That Shouldn't Exist"
    name_ta: "இருக்கவே கூடாத அதிசயங்கள்"
    about: >-
      real objects, buildings, places or phenomena that seem impossible (floating pillar, 1600-year
      rust-free iron pillar, a fire burning since 1962), and the real explanation or open question
  - id: "survived"
    name_en: "How Did They Survive?"
    name_ta: "எப்படி உயிர் பிழைத்தார்கள்?"
    about: >-
      disasters, near-disasters and impossible survivals (people, cities, ships), with the exact moment
      it almost ended and what saved them

series:
  - id: "mandir"
    name: "मंदिरों के रहस्य"
    name_en: "Temple Mysteries"                # English and other non-Hindi channels
    label: "मंदिर का रहस्य"
    about: >-
      mysteries, legends and history of famous Indian temples and shrines (architecture, miracles
      believed by devotees, origin stories), told respectfully; beliefs presented as beliefs
  - id: "pauranik"
    name: "पौराणिक रहस्य"
    name_en: "Mythology Mysteries"                # English and other non-Hindi channels
    label: "पौराणिक रहस्य"
    about: >-
      places and stories linked to the Ramayana, Mahabharata and Puranas (Ram Setu, Dwarka, Kurukshetra),
      what history, archaeology and tradition each say; respectful, never mocking
  - id: "bharat"
    name: "भारत के अनसुलझे रहस्य"
    name_en: "Unsolved Mysteries of India"                # English and other non-Hindi channels
    label: "भारत के रहस्य"
    about: "Indian history, forts, temples, kings, freedom struggle, unsolved Indian cases and places"
  - id: "duniya"
    name: "दुनिया के रहस्य"
    name_en: "World Mysteries"                # English and other non-Hindi channels
    label: "दुनिया के रहस्य"
    about: "world mysteries, lost civilisations, strange events outside India"
  - id: "kahani"
    name: "इतिहास की सच्ची कहानियाँ"
    name_en: "True Stories from History"                # English and other non-Hindi channels
    label: "सच्ची कहानी"
    about: "dramatic true stories of real people: survivors, spies, explorers, rulers"

# Extra Shorts cut from each long video (same pictures, new hook), linking to the full video.
# Off: fewer, better Shorts beat volume while the channel is learning (each Short gets YouTube's
# full test audience, and the free AI budget goes into quality). Set 1-2 once Shorts hold viewers.
clips:
  per_long: 0
  publish_utc: ["09:30", "16:30"]     # 3:00 PM and 10:00 PM IST

# Each long video also becomes a website article and a podcast episode (site/ on GitHub Pages).
podcast:
  enabled: true
  title: "Odd Annals — रहस्य और इतिहास"
  owner_email: ""                     # Spotify/Apple send the ownership code here; set your channel email

# Weekly formats: a "guess the place" quiz Short (answer revealed next day) and a two-part long story.
formats:
  short_two_part_daily: true          # one story a day as Part 1 + Part 2 Shorts, public together
  quiz_day: "fri"
  two_part_day: "wed"

# Backup videos kept private on YouTube and published only if a day's run fails or is late.
reserve:
  target: 2

# Amazon India affiliate links (books on the video's topic) — off until you add your Associates tag.
affiliate:
  amazon_tag: ""                      # e.g. "oddannals-21" from affiliate-program.amazon.in

# Sunday: the week's Shorts stitched into one long video (watch hours from existing footage).
compilation:
  enabled: false                      # owner decision Oct 15: no long videos at all (Shorts only)
  day: "sun"

# Also post every Short as an Instagram Reel / Facebook Reel when Meta credentials exist.
social:
  instagram: true
  facebook: false                     # owner decision Oct 17: Instagram only

keywords:
  # YouTube autocomplete is queried with these to see what Indian viewers search for right now.
  niche_seeds: ["रहस्य", "रहस्यमयी", "अनसुलझे रहस्य", "इतिहास की कहानी", "भारत का इतिहास",
                "mystery in hindi", "history in hindi", "unsolved mystery hindi", "sach kya hai",
                "duniya ke rahasya", "kaise hua", "kyon hua"]

quality:
  hook_candidates: 6                  # hooks written AFTER the full script; hookscore.py keeps the best
  title_candidates: 10                # LLM writes N titles, title.py keeps the best
  max_script_attempts: 2
  min_review_score: 6.5               # quality gate: average 1-10 score a script needs to be made

thumbnails:
  mode: "ab"                          # ab = rotate templates, then favour the winner (data/thumb_winner.json)
  templates: ["rahasya", "storybook", "yellow"]   # rahasya = the niche's winning look (see README)
  label: "ODD ANNALS • MYSTERY"        # yellow series label at the bottom of storybook thumbnails

reach:
  auto_publish_private: false         # true = make our private, unscheduled uploads public. Off so a
                                      # video YOU set to private is never re-published automatically.
  post_comments: true                 # channel posts the script's question as the first comment
  max_replies_per_day: 6              # English replies to new viewer comments (0 = off)
  repackage_after_hours: 72           # judge a video after 3 days...
  repackage_below_median: 0.5         # ...and retitle it once if under half its peers' median views

youtube:
  privacy: "public"                   # public | unlisted | private
  token_days: 7                       # Google "Testing" apps: logins die 7 days after sign-in (0 = app published)
  made_for_kids: false
  # Set true if a video contains realistic AI-generated people/events viewers could mistake for real.
  # Stock footage + narration does not need it.
  contains_synthetic_media: true      # photoreal AI scenes of real events: YouTube requires the label
  long_playlist_id: ""                # optional: auto-add long videos to this playlist
  short_playlist_id: ""
