<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd Annals</title>
<meta name="description" content="Odd Annals: animated history and mystery stories in Hindi and Tamil, new every day.">
<link rel="icon" href="branding/logo.png">
<style>
  :root { --bg: #0b0b10; --card: #16161f; --text: #f3f3f5; --muted: #a3a3b2; --accent: #ffd60a; --red: #e5121b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  main { width: 100%; max-width: 560px; text-align: center; }
  img.logo { width: 112px; height: 112px; border-radius: 50%; box-shadow: 0 0 0 4px var(--accent); }
  h1 { font-size: 2rem; margin: 18px 0 4px; letter-spacing: .5px; }
  p.tag { color: var(--muted); margin: 0 0 28px; }
  a.card { display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; color: var(--text);
           background: var(--card); border: 1px solid #262633; border-radius: 14px; padding: 14px 18px; margin: 10px 0; }
  a.card:hover { border-color: var(--accent); }
  a.card b { display: block; }
  a.card span { color: var(--muted); font-size: .9rem; }
  .icon { font-size: 1.6rem; width: 2rem; text-align: center; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="branding/logo.png" alt="Odd Annals logo">
  <h1>Odd Annals</h1>
  <p class="tag">रहस्य • इतिहास — animated history and mystery stories, new every day</p>
  <a class="card" href="https://www.youtube.com/@oddannals"><div class="icon">▶️</div><div><b>Odd Annals (Hindi)</b><span>YouTube · @oddannals</span></div></a>
  <a class="card" href="https://www.youtube.com/@oddannalstamil"><div class="icon">▶️</div><div><b>Odd Annals Tamil</b><span>YouTube · @oddannalstamil</span></div></a>
  <a class="card" href="dashboard/"><div class="icon">📊</div><div><b>Channel dashboard</b><span>Views, watch hours and growth</span></div></a>
  <footer><a href="privacy/">Privacy policy</a></footer>
</main>
</body>
</html>
