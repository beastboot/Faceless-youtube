name: Daily videos

on:
  schedule:
    - cron: "17 7 * * *"        # 07:17 UTC (12:47 IST), just after Gemini's free quota resets: odd minute = less GitHub queueing; publish times in config.yaml
  workflow_dispatch:
    inputs:
      longs:
        description: "Long videos to make"
        default: "1"
      shorts:
        description: "Shorts to make"
        default: "2"
      reach_only:
        description: "Only run the reach report (no new videos)"
        type: boolean
        default: false
      no_upload:
        description: "Render only (test run, nothing published)"
        type: boolean
        default: false
      auto:
        description: "The daily timer (started by the Telegram bot's Cloudflare cron): behaves like the schedule"
        type: boolean
        default: false

concurrency:
  group: daily-videos
  cancel-in-progress: false

permissions:
  contents: write                # commit data/history.json back
  actions: read                  # Sunday compilation downloads the week's Shorts artifacts

jobs:
  produce:
    runs-on: ubuntu-24.04   # pinned: our ffmpeg/libraqm/Chrome setup is tested on 24.04 (ubuntu-latest moves to 26)
    timeout-minutes: 300           # Pollinations fallback is slow if the Cloudflare budget runs out
    steps:
      - name: Telegram — run started
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🟡 Odd Annals run started (${{ github.event_name }})
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v4

      - name: Install ffmpeg + headless-Chrome libraries (Remotion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libraqm0 fonts-noto-color-emoji \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install Remotion (motion-graphics renderer)
        working-directory: remotion
        run: npm ci --no-audit --no-fund && npx remotion browser ensure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make and upload videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID_TA: ${{ secrets.YT_CLIENT_ID_TA }}
          YT_CLIENT_SECRET_TA: ${{ secrets.YT_CLIENT_SECRET_TA }}
          YT_REFRESH_TOKEN_TA: ${{ secrets.YT_REFRESH_TOKEN_TA }}
          YT_CLIENT_ID_TE: ${{ secrets.YT_CLIENT_ID_TE }}
          YT_CLIENT_SECRET_TE: ${{ secrets.YT_CLIENT_SECRET_TE }}
          YT_REFRESH_TOKEN_TE: ${{ secrets.YT_REFRESH_TOKEN_TE }}
          YT_CLIENT_ID_BN: ${{ secrets.YT_CLIENT_ID_BN }}
          YT_CLIENT_SECRET_BN: ${{ secrets.YT_CLIENT_SECRET_BN }}
          YT_REFRESH_TOKEN_BN: ${{ secrets.YT_REFRESH_TOKEN_BN }}
          YT_CLIENT_ID_MR: ${{ secrets.YT_CLIENT_ID_MR }}
          YT_CLIENT_SECRET_MR: ${{ secrets.YT_CLIENT_SECRET_MR }}
          YT_REFRESH_TOKEN_MR: ${{ secrets.YT_REFRESH_TOKEN_MR }}
          BOT_CONTACT: ${{ secrets.BOT_CONTACT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          AUTO_RUN: ${{ inputs.auto }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "true" ]; then
            ARGS="--longs ${{ inputs.longs }} --shorts ${{ inputs.shorts }}"
            if [ "${{ inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
            if [ "${{ inputs.reach_only }}" = "true" ]; then ARGS="--reach"; fi
          fi
          python main.py $ARGS

      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ assets/host/ site/ 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "history + reach report: $(date -u +%F) run"
          git pull --rebase -q && git push

      - name: Keep rendered files for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            output/*/*/metadata.json
            output/*/*/thumbnail*.jpg
            output/*/*/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep this run's Shorts for the Sunday compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            output/*-short-*/hi/final.mp4
            output/*-short-*/hi/metadata.json
            output/*-long-*/hi-clip*/final.mp4
            output/*-long-*/hi-clip*/metadata.json
          retention-days: 10
          if-no-files-found: ignore

      - name: Keep videos from test runs, or when something failed (re-upload with --upload-dir)
        if: inputs.no_upload || failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/*/*/final.mp4
          retention-days: 3

      - name: Telegram — run crashed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🔴 Odd Annals run FAILED — check the log:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram — run passed
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🟢 Odd Annals run PASSED
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
