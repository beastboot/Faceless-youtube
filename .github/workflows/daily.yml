name: Daily videos

on:
  schedule:
    - cron: "30 5 * * *"        # 05:30 UTC daily; publish times are set in config.yaml
  workflow_dispatch:
    inputs:
      longs:
        description: "Long videos to make"
        default: "1"
      shorts:
        description: "Shorts to make"
        default: "2"
      no_upload:
        description: "Render only (test run, nothing published)"
        type: boolean
        default: false

concurrency:
  group: daily-videos
  cancel-in-progress: false

permissions:
  contents: write                # commit data/history.json back

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make and upload videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BOT_CONTACT: ${{ secrets.BOT_CONTACT }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--longs ${{ inputs.longs }} --shorts ${{ inputs.shorts }}"
            if [ "${{ inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          fi
          python main.py $ARGS

      - name: Save history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -m "history: $(date -u +%F) run" && git push

      - name: Keep rendered files for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: |
            output/*/script.json
            output/*/metadata.json
            output/*/thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep videos from test runs
        if: inputs.no_upload
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/*/final.mp4
          retention-days: 3
